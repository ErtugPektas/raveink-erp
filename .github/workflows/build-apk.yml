name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Dependencies
      run: npm install

    - name: Build Next.js Static Export
      run: npm run build

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Build Android APK (Debug)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RaveInk-ERP-Android-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Create or Update GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Delete old latest release and tag if they exist
        gh release delete latest --yes || true
        git tag -d latest || true
        git push origin :refs/tags/latest || true

        # Create new latest release with the APK
        gh release create latest android/app/build/outputs/apk/debug/app-debug.apk \
          --title "RaveInk ERP Mobil Sürüm" \
          --notes "Otomatik oluşturulan en güncel test sürümü. Doğrudan indirip telefonunuza kurabilirsiniz." \
          --target main \
          --prerelease
